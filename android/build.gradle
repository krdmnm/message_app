allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // ... diğer bağımlılıklar
        classpath 'com.android.tools.build:gradle:7.3.0' // veya kullandığınız gradle versiyonu
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.10' // veya kullandığınız kotlin versiyonu
    }
}